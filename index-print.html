function BlurText({ text, className = "", splitBy = "word", delay = 200, stagger = 0.06 }) {
  const ref = useRef(null);
  const [inView, setInView] = useState(false);
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const obs = new IntersectionObserver((entries) => {
      entries.forEach((e) => { if (e.isIntersecting) { setInView(true); obs.disconnect(); } });
    }, { threshold: 0.2 });
    obs.observe(el);
    return () => obs.disconnect();
  }, []);
  const parts = useMemo(() => splitBy === "letter" ? Array.from(text) : text.split(" "), [text, splitBy]);
  return (
    <span ref={ref} className={className} style={{ display: "inline-block" }}>
      {parts.map((p, i) => (
        <motion.span key={i}
          initial={{ filter: "blur(10px)", opacity: 0, y: 50 }}
          animate={inView ? { filter: "blur(0px)", opacity: 1, y: 0 } : { filter: "blur(10px)", opacity: 0, y: 50 }}
          transition={{ duration: 0.7, delay: delay / 1000 + i * stagger, ease: [0.22, 1, 0.36, 1] }}
          style={{ display: "inline-block", whiteSpace: "pre", willChange: "filter, opacity, transform" }}
        >
          {p}{splitBy === "word" && i < parts.length - 1 ? "\u00A0" : ""}
        </motion.span>
      ))}
    </span>
  );
}

    document.querySelectorAll('span').forEach((s) => {
      if (s.style && s.style.filter && s.style.filter.indexOf('blur') !== -1) {
        s.style.filter = 'none';
        s.style.opacity = '1';
        s.style.transform = 'none';
      }
    });
    window.print();
  }
  Promise.all([
    document.fonts ? document.fonts.ready : Promise.resolve(),
    new Promise((r) => window.addEventListener('load', r, { once: true })),
  ]).then(() => setTimeout(triggerPrint, 1200));
})();
    </script>
  </body>
</html>
